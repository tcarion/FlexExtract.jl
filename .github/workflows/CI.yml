name: CI
on:
  push:
    branches:
      - main
    tags: ['*']
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ startsWith(github.ref, 'refs/pull/') }}

jobs:
  test:
    name: Julia ${{ matrix.version }} - ${{ matrix.os }} - ${{ matrix.arch }} - ${{ github.event_name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        version:
          - '1'
          - 'nightly'
        os:
          - ubuntu-latest
        arch:
          - x64

    steps:
      - uses: actions/checkout@v4

      # Install uv
      - name: Install uv
        uses: astral-sh/setup-uv@v3

      # Create Python venv + install dependencies
      - name: Create Python venv
        run: |
          uv venv .venv
          source .venv/bin/activate
          uv pip install ecmwf-api-client eccodes numpy cdsapi genshi

      - uses: julia-actions/setup-julia@latest
        with:
          version: ${{ matrix.version }}
          arch: ${{ matrix.arch }}

      - uses: julia-actions/cache@v2

      # Build Julia package using the venv Python
      - name: Build Julia package
        env:
          PYTHON: ${{ github.workspace }}/.venv/bin/python
        run: julia --project -e 'using Pkg; Pkg.build()'

      # Run tests inside the venv
      - name: Run tests
        env:
          PYTHON: ${{ github.workspace }}/.venv/bin/python
        run: julia --project -e 'using Pkg; Pkg.test(coverage=true)'

      - uses: julia-actions/julia-processcoverage@latest

      - uses: codecov/codecov-action@v5
        with:
          files: lcov.info

  docs:
    name: Documentation
    runs-on: ubuntu-latest
    permissions:
      contents: write
      statuses: write

    steps:
      - uses: actions/checkout@v4

      # Install uv
      - name: Install uv
        uses: astral-sh/setup-uv@v3

      # Create Python venv + install dependencies
      - name: Create Python venv
        run: |
          uv venv .venv
          source .venv/bin/activate
          uv pip install ecmwf-api-client eccodes numpy cdsapi genshi

      - uses: julia-actions/setup-julia@latest
        with:
          version: '1'

      - name: Build Julia package
        env:
          PYTHON: ${{ github.workspace }}/.venv/bin/python
        run: julia --project -e 'using Pkg; Pkg.build()'

      - name: Deploy documentation
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PYTHON: ${{ github.workspace }}/.venv/bin/python
        run: julia --project=docs -e 'using Pkg; Pkg.develop(path="."); include("docs/make.jl")'

      - name: Run doctests
        env:
          PYTHON: ${{ github.workspace }}/.venv/bin/python
        run: |
          julia --project=docs -e '
            using Documenter: DocMeta, doctest
            using FlexExtract
            DocMeta.setdocmeta!(FlexExtract, :DocTestSetup, :(using FlexExtract); recursive=true)
            doctest(FlexExtract)'